<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Construction crew pipeline illustration"><rect x="0" y="0" width="900" height="300" fill="#eaf4fb"/><rect x="60" y="120" width="140" height="70" rx="10" fill="#ffffff" stroke="#41546b" stroke-width="2"/><text x="130" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">Blueprint</text><text x="130" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">(CodeCommit)</text><path d="M 200 155 L 228 155" stroke="#41546b" stroke-width="4" fill="none"/><rect x="228" y="120" width="140" height="70" rx="10" fill="#ffffff" stroke="#41546b" stroke-width="2"/><text x="298" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">Build plan</text><text x="298" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">(Synth)</text><path d="M 368 155 L 396 155" stroke="#41546b" stroke-width="4" fill="none"/><rect x="396" y="120" width="140" height="70" rx="10" fill="#ffffff" stroke="#41546b" stroke-width="2"/><text x="466" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">Update own</text><text x="466" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">permits first</text><path d="M 536 155 L 564 155" stroke="#41546b" stroke-width="4" fill="none"/><rect x="564" y="120" width="140" height="70" rx="10" fill="#ffffff" stroke="#41546b" stroke-width="2"/><text x="634" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">Director</text><text x="634" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">sign-off</text><path d="M 704 155 L 732 155" stroke="#41546b" stroke-width="4" fill="none"/><rect x="732" y="120" width="140" height="70" rx="10" fill="#ffffff" stroke="#41546b" stroke-width="2"/><text x="802" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">Break</text><text x="802" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#1b2a41">ground</text><text x="450" y="50" text-anchor="middle" font-size="16" font-weight="800" fill="#1b2a41">The crew updates its own permit process before touching a runway</text></svg>