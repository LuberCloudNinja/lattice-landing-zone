<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Security vault illustration"><rect x="0" y="0" width="500" height="380" fill="#eaf4fb"/><rect x="120" y="80" width="260" height="220" rx="14" fill="#ffffff" stroke="#41546b" stroke-width="2"/><circle cx="250" cy="190" r="46" fill="none" stroke="#d6742f" stroke-width="8"/><circle cx="250" cy="190" r="10" fill="#d6742f"/><rect x="235" y="190" width="30" height="46" fill="#d6742f"/><text x="180" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#1b2a41">5 separate keys</text><text x="320" y="340" text-anchor="middle" font-size="11" font-weight="600" fill="#1b2a41">one ceiling badge</text><text x="250" y="50" text-anchor="middle" font-size="15" font-weight="800" fill="#1b2a41">Five separate keys, one badge policy every door respects</text></svg>